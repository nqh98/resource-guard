name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and platform tests
        run: python -m unittest discover -s tests -v
      - name: Install and start the dashboard
        run: |
          python -m pip install .
          resource-guard --port 8799 &
          for i in $(seq 1 15); do curl -fs http://127.0.0.1:8799/api/state > state.json && break; sleep 1; done
          python -c "import json; s = json.load(open('state.json')); print(s['platform'], s['cpu'], s['mem']); assert s['groups']"
          curl -fs http://127.0.0.1:8799/api/settings
